<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munchoice – Shopping list</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍴</text></svg>" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app.title">🍴 Munchoice</h1>
    <div class="topbar-right">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en"><img src="https://flagcdn.com/20x15/gb.png" alt="EN" /></button>
        <button class="lang-btn" data-lang="nl"><img src="https://flagcdn.com/20x15/nl.png" alt="NL" /></button>
      </div>
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-secondary" data-i18n="btn.logout">Logout</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="app.html" data-i18n="nav.recipes">📚 My recipes</a>
    <a href="decide.html" data-i18n="nav.decide">🎲 Decide what to eat</a>
    <a href="shopping.html" class="active" data-i18n="nav.shopping">🛒 Shopping list</a>
  </nav>

  <main class="container wide">
    <section class="card">
      <h2 data-i18n="shopping.heading">Build your shopping list</h2>
      <p class="hint" data-i18n="shopping.hint">Tick the recipes...</p>

      <div class="shopping-actions">
        <button id="select-all-btn" class="btn-secondary" data-i18n="shopping.selectAll">Select all</button>
        <button id="deselect-all-btn" class="btn-secondary" data-i18n="shopping.deselectAll">Deselect all</button>
        <button id="generate-btn" data-i18n="shopping.generate">🛒 Generate shopping list</button>
      </div>

      <div id="recipe-picker">Loading…</div>
    </section>

    <section class="card" id="list-card" style="display:none;">
      <div class="list-header">
        <h2 data-i18n="shopping.listHeading">Your shopping list</h2>
        <div class="shopping-actions">
          <button id="copy-list-btn" class="btn-secondary" data-i18n="shopping.copyList">📋 Copy list</button>
          <button id="print-list-btn" class="btn-secondary" data-i18n="shopping.print">🖨️ Print</button>
        </div>
      </div>
      <div id="shopping-output"></div>
      <p id="copy-feedback" class="hint"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shopping.js"></script>
</body>
</html>
