<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Decider – Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <div class="lang-switch lang-switch-top">
      <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
      <button class="lang-btn" data-lang="nl">🇳🇱 NL</button>
    </div>

    <h1 data-i18n="app.title">🍽️ Recipe Decider</h1>
    <p data-i18n="app.tagline">Your personal recipe collection & meal decider.</p>

    <section id="auth-section">
      <h2 data-i18n="auth.heading">Login or Sign up</h2>
      <form id="auth-form">
        <input type="email" id="email" required data-i18n-placeholder="auth.email" placeholder="Email" />
        <input type="password" id="password" required data-i18n-placeholder="auth.password" placeholder="Password" />
        <div class="button-row">
          <button type="button" id="login-btn" data-i18n="auth.login">Login</button>
          <button type="button" id="signup-btn" data-i18n="auth.signup">Sign up</button>
        </div>
        <p id="auth-message"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
