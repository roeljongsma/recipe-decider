<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Decider – My Recipes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app.title">🍽️ Recipe Decider</h1>
    <div class="topbar-right">
      <div class="lang-switch">
<button class="lang-btn" data-lang="en">
  <img src="https://flagcdn.com/20x15/gb.png" alt="EN" />
</button>
<button class="lang-btn" data-lang="nl">
  <img src="https://flagcdn.com/20x15/nl.png" alt="NL" />
</button>
      </div>
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-secondary" data-i18n="btn.logout">Logout</button>
    </div>
  </header>

  <nav class="subnav">
    <a href="app.html" class="active" data-i18n="nav.recipes">📚 My recipes</a>
    <a href="decide.html" data-i18n="nav.decide">🎲 Decide what to eat</a>
  </nav>

  <main class="container wide">

    <section class="card">
      <h2 data-i18n="recipe.addHeading">➕ Add a new recipe</h2>
      <form id="recipe-form">
        <label><span data-i18n="recipe.title">Title</span>
          <input type="text" id="recipe-title" required data-i18n-placeholder="recipe.titlePlaceholder" placeholder="e.g. Spaghetti Bolognese" />
        </label>

        <label><span data-i18n="recipe.servings">For how many people</span>
          <input type="number" id="recipe-servings" min="1" value="2" required />
        </label>

        <label><span data-i18n="recipe.pasteLabel">Paste ingredients (one per line)</span>
          <textarea id="ingredients-paste" rows="6" data-i18n-placeholder="recipe.pastePlaceholder"></textarea>
        </label>
        <button type="button" id="parse-btn" class="btn-secondary" data-i18n="recipe.parseBtn">Parse ingredients ↓</button>

        <div id="parsed-ingredients"></div>

        <label><span data-i18n="recipe.steps">Steps to cook</span>
          <textarea id="recipe-steps" rows="6" data-i18n-placeholder="recipe.stepsPlaceholder"></textarea>
        </label>

        <button type="submit" data-i18n="recipe.save">💾 Save recipe</button>
        <p id="recipe-message"></p>
      </form>
    </section>

    <section class="card">
      <h2 data-i18n="list.heading">📚 My recipes</h2>
      <div id="recipes-list" data-i18n="list.loading">Loading…</div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/recipes.js"></script>
</body>
</html>
