<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Munchoice – Shared recipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍴</text></svg>" />
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app.title">🍴 Munchoice</h1>
    <div class="topbar-right">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en"><img src="https://flagcdn.com/20x15/gb.png" alt="EN" /></button>
        <button class="lang-btn" data-lang="nl"><img src="https://flagcdn.com/20x15/nl.png" alt="NL" /></button>
      </div>
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-secondary" data-i18n="btn.logout">Logout</button>
    </div>
  </header>

  <main class="container wide">
    <section class="card">
      <h2 data-i18n="shared.heading">Shared recipe</h2>
      <div id="shared-recipe">Loading…</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shared.js"></script>
</body>
</html>
